<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advance Happy Birthday Aami 🤗😙 ✨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #2e0854, #120324, #05000a);
      color: #ffffff;
      padding: 24px 16px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 36px 22px;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      max-width: 440px;
      width: 100%;
    }

    .subtitle {
      font-size: 0.9rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ff9ec6;
      margin-bottom: 10px;
      font-weight: 600;
    }

    h1 {
      font-size: 1.85rem;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 50%, #fad0c4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.3;
    }

    p.message {
      font-size: 0.95rem;
      color: #d1c4e9;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .countdown-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .time-box {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 12px 6px;
      flex: 1;
      min-width: 60px;
    }

    .number {
      font-size: 1.7rem;
      font-weight: 700;
      color: #fff;
      display: block;
      line-height: 1;
    }

    .label {
      font-size: 0.65rem;
      color: #ffb3d9;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 6px;
      display: block;
    }

    .target-date {
      font-size: 0.88rem;
      color: #b39ddb;
      letter-spacing: 1.5px;
      margin-bottom: 26px;
    }

    .note-section {
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 22px;
      text-align: center;
    }

    .note-prompt {
      font-size: 0.92rem;
      color: #ffccdf;
      margin-bottom: 12px;
      font-weight: 500;
      line-height: 1.4;
    }

    textarea {
      width: 100%;
      height: 95px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 12px;
      color: #fff;
      font-size: 0.9rem;
      resize: none;
      outline: none;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    textarea::placeholder {
      color: rgba(255, 255, 255, 0.45);
    }

    .send-btn {
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      border: none;
      color: white;
      padding: 12px 28px;
      font-size: 0.92rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
      transition: transform 0.2s ease;
    }

    .send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 12px;
      font-size: 0.88rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="subtitle">Countdown Begins</div>
    <h1>Advance Happy Birthday, Aami 🤗😙</h1>
    <p class="message">Counting down every single second until your special day!</p>

    <div class="countdown-container">
      <div class="time-box">
        <span class="number" id="days">00</span>
        <span class="label">Days</span>
      </div>
      <div class="time-box">
        <span class="number" id="hours">00</span>
        <span class="label">Hours</span>
      </div>
      <div class="time-box">
        <span class="number" id="minutes">00</span>
        <span class="label">Mins</span>
      </div>
      <div class="time-box">
        <span class="number" id="seconds">00</span>
        <span class="label">Secs</span>
      </div>
    </div>

    <div class="target-date">✨ September 12 ✨</div>

    <!-- Interactive Note Section -->
    <div class="note-section" id="noteContainer">
      <p class="note-prompt">💌 Leave a sweet note or wish for me:</p>
      <textarea id="userNote" placeholder="Type your message here..."></textarea>
      <br>
      <button class="send-btn" id="submitBtn" onclick="submitNote()">Send Note 💌</button>
      <p class="status-msg" id="statusMsg"></p>
    </div>
  </div>

  <script>
    const YOUR_EMAIL = "shuhaibtshukoor@gmail.com";

    const targetYear = new Date().getFullYear();
    let targetDate = new Date(`September 12, ${targetYear} 00:00:00`).getTime();
    if (new Date().getTime() > targetDate) {
      targetDate = new Date(`September 12, ${targetYear + 1} 00:00:00`).getTime();
    }

    function updateCountdown() {
      const now = new Date().getTime();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.querySelector('.card').innerHTML = `
          <div class="subtitle">It's Finally Here!</div>
          <h1>🎉 Happy Birthday, Aami 🤗😙 🎂</h1>
          <p class="message">Wishing you a wonderful day filled with endless love and happiness! ✨</p>
        `;
        return;
      }

      document.getElementById('days').textContent = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
      document.getElementById('hours').textContent = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
      document.getElementById('minutes').textContent = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
      document.getElementById('seconds').textContent = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    async function submitNote() {
      const note = document.getElementById('userNote').value.trim();
      const statusMsg = document.getElementById('statusMsg');
      const btn = document.getElementById('submitBtn');

      if (!note) {
        alert("Please write a message first!");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Sending...";
      statusMsg.style.display = "none";

      try {
        const response = await fetch(`https://formsubmit.co/ajax/${YOUR_EMAIL}`, {
          method: "POST",
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            Sender: "Aami 🤗😙",
            Message: note,
            Date: new Date().toLocaleString()
          })
        });

        if (response.ok) {
          document.getElementById('noteContainer').innerHTML = `
            <p style="color: #ff9ec6; font-size: 1.05rem; font-weight: 600; margin-top: 10px;">
              ✨ Received! Thank you for the sweet note! 💖
            </p>
          `;
        } else {
          throw new Error("Failed to send");
        }
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Send Note 💌";
        statusMsg.style.display = "block";
        statusMsg.style.color = "#ff6b6b";
        statusMsg.textContent = "Could not send right now. Please try again!";
      }
    }
  </script>
</body>
</html>
